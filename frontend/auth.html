<!DOCTYPE html>
<html lang="en">
<head>

    <script>

        if (savedUid) {

        } else {
            gtag('config', 'G-FK3PF0KZ2R');
        }

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Observability</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0c0c0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-card: rgba(18, 18, 26, 0.8);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --success: #22c55e;
            --error: #ef4444;
            --transition-fast: 0.15s ease;
            --transition-medium: 0.3s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 50% 30% at 0% 100%, rgba(129, 140, 248, 0.06), transparent);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent);
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            animation: breathe 8s ease-in-out infinite;
        }

        .bg-glow-1 {
            background: var(--accent-primary);
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.12;
        }

        .bg-glow-2 {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            bottom: -400px;
            right: -200px;
            width: 500px;
            height: 500px;
            opacity: 0.08;
            animation-delay: -4s;
        }

        @keyframes breathe {
            0%, 100% { 
                transform: translateX(-50%) scale(1); 
                opacity: 0.12;
            }
            50% { 
                transform: translateX(-50%) scale(1.1); 
                opacity: 0.18;
            }
        }

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: drift 20s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 25s; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-duration: 20s; animation-delay: -5s; }
        .particle:nth-child(3) { left: 35%; animation-duration: 28s; animation-delay: -10s; }
        .particle:nth-child(4) { left: 50%; animation-duration: 22s; animation-delay: -15s; }
        .particle:nth-child(5) { left: 65%; animation-duration: 26s; animation-delay: -8s; }

        @keyframes drift {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            z-index: 1;
        }

        .form {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form_front,
        .form_back {
            position: absolute;
            width: 440px;
            padding: 48px;
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            backface-visibility: hidden;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 20px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 100px -20px var(--accent-glow);
        }

        .form_back {
            transform: rotateY(-180deg);
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px -8px rgba(99, 102, 241, 0.4);
        }

        .form-logo svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .form-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.9375rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            outline: none;
            transition: all var(--transition-fast);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:hover {
            border-color: var(--border-light);
        }

        .input-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--bg-secondary);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition-medium);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #7c3aed, var(--accent-primary));
            opacity: 0;
            transition: opacity var(--transition-medium);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary span {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            gap: 16px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .divider-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .switch-text {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .switch-link {
            color: var(--accent-secondary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            transition: color var(--transition-fast);
        }

        .switch-link:hover {
            color: var(--text-primary);
        }

        .container #signup_toggle {
            display: none;
        }

        .container #signup_toggle:checked + .form {
            transform: rotateY(-180deg);
        }

        .msg-area {
            min-height: 20px;
            margin-bottom: 8px;
        }

        .msg-area span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            font-weight: 500;
        }

        .text-error {
            color: var(--error);
        }

        .text-success {
            color: var(--success);
        }

        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 80px 0;
        }

        .loader-container.active {
            display: flex;
        }

        .loader {
            width: 48px;
            height: 48px;
            position: relative;
        }

        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .loader::before {
            border-top-color: var(--accent-primary);
            animation: spin 1s linear infinite;
        }

        .loader::after {
            border-right-color: var(--accent-secondary);
            animation: spin 1.5s linear infinite reverse;
            inset: 4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 0.8125rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .form-content {
            display: block;
        }

        .form-content.hidden {
            display: none;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            transition: all var(--transition-fast);
        }

        .footer-link:hover {
            color: var(--text-primary);
            border-color: var(--border-light);
            background: var(--bg-tertiary);
        }

        .footer-link svg {
            width: 16px;
            height: 16px;
        }

        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 3px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            transition: background var(--transition-fast);
        }

        .strength-bar.weak { background: var(--error); }
        .strength-bar.medium { background: #f59e0b; }
        .strength-bar.strong { background: var(--success); }

        @media (max-width: 500px) {
            .form_front,
            .form_back {
                width: calc(100vw - 32px);
                padding: 32px 24px;
                border-radius: 20px;
            }
            
            .form-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-wrapper">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <div class="container">
        <input type="checkbox" id="signup_toggle">
        <div class="form">
            <!-- Login -->
            <div class="form_front">
                <div id="login-content" class="form-content">
                    <div class="form-header">
                        <div class="form-logo">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                                <polyline points="10 17 15 12 10 7"/>
                                <line x1="15" y1="12" x2="3" y2="12"/>
                            </svg>
                        </div>
                        <h1 class="form-title">Welcome back</h1>
                        <p class="form-subtitle">Sign in to your account to continue</p>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="login-email">Email address</label>
                        <div class="input-wrapper">
                            <input type="email" id="login-email" class="input-field" placeholder="name@company.com" autocomplete="email">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="login-password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="login-password" class="input-field" placeholder="Enter your password" autocomplete="current-password">
                        </div>
                    </div>

                    <div class="msg-area" id="login-msg"></div>

                    <button class="btn-primary" id="login-btn" onclick="login()">
                        <span>Sign In
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </span>
                    </button>

                    <div class="divider">
                        <div class="divider-line"></div>
                        <span class="divider-text">New here?</span>
                        <div class="divider-line"></div>
                    </div>

                    <p class="switch-text">
                        <label class="switch-link" for="signup_toggle">Create an account</label>
                    </p>
                </div>

                <div id="login-loader" class="loader-container">
                    <div class="loader"></div>
                    <span class="loader-text mono">Authenticating...</span>
                </div>
            </div>

            <!-- Register -->
            <div class="form_back">
                <div id="signup-content" class="form-content">
                    <div class="form-header">
                        <div class="form-logo">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <line x1="19" y1="8" x2="19" y2="14"/>
                                <line x1="22" y1="11" x2="16" y2="11"/>
                            </svg>
                        </div>
                        <h1 class="form-title">Create account</h1>
                        <p class="form-subtitle">Get started with your free account</p>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="signup-name">Display name</label>
                        <div class="input-wrapper">
                            <input type="text" id="signup-name" class="input-field" placeholder="John Doe" autocomplete="name">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="signup-email">Email address</label>
                        <div class="input-wrapper">
                            <input type="email" id="signup-email" class="input-field" placeholder="name@company.com" autocomplete="email">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="signup-password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="signup-password" class="input-field" placeholder="Min. 6 characters" autocomplete="new-password" oninput="checkPasswordStrength(this.value)">
                        </div>
                        <div class="password-strength" id="password-strength">
                            <div class="strength-bar" id="str-1"></div>
                            <div class="strength-bar" id="str-2"></div>
                            <div class="strength-bar" id="str-3"></div>
                            <div class="strength-bar" id="str-4"></div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="signup-confirm">Confirm password</label>
                        <div class="input-wrapper">
                            <input type="password" id="signup-confirm" class="input-field" placeholder="Re-enter password" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="msg-area" id="signup-msg"></div>

                    <button class="btn-primary" id="signup-btn" onclick="signup()">
                        <span>Create Account
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </span>
                    </button>

                    <div class="divider">
                        <div class="divider-line"></div>
                        <span class="divider-text">Already registered?</span>
                        <div class="divider-line"></div>
                    </div>

                    <p class="switch-text">
                        <label class="switch-link" for="signup_toggle">Sign in instead</label>
                    </p>
                </div>

                <div id="signup-loader" class="loader-container">
                    <div class="loader"></div>
                    <span class="loader-text mono">Creating account...</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <a href="index.html" class="footer-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back to Home
        </a>
    </footer>

    <script>
        // ============================================
        // FIREBASE CONFIG - REPLACE WITH YOUR VALUES
        // ============================================
        const firebaseConfig = {
  apiKey: "AIzaSyClqc-guDRyceAkZJhcPKwydwQ456Tt4N4",
  authDomain: "aicwd-16aea.firebaseapp.com",
  projectId: "aicwd-16aea",
  storageBucket: "aicwd-16aea.firebasestorage.app",
  messagingSenderId: "566736679532",
  appId: "1:566736679532:web:7ce638e3430a9ea0d4de49",
  measurementId: "G-DY8HDKWZRT"
};
        // ============================================

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (user) {
                gtag('config', 'G-FK3PF0KZ2R', { 'user_id': user.uid });
                localStorage.setItem('firebase_uid', user.uid);
            }
        });

        function showLoader(type) {
            document.getElementById(`${type}-content`).classList.add('hidden');
            document.getElementById(`${type}-loader`).classList.add('active');
        }

        function hideLoader(type) {
            document.getElementById(`${type}-loader`).classList.remove('active');
            document.getElementById(`${type}-content`).classList.remove('hidden');
        }

        function showMessage(type, message, isError = true) {
            const msgEl = document.getElementById(`${type}-msg`);
            const icon = isError 
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
            msgEl.innerHTML = `<span class="${isError ? 'text-error' : 'text-success'}">${icon} ${message}</span>`;
        }

        function clearMessage(type) {
            document.getElementById(`${type}-msg`).innerHTML = '';
        }

        function checkPasswordStrength(password) {
            const bars = [
                document.getElementById('str-1'),
                document.getElementById('str-2'),
                document.getElementById('str-3'),
                document.getElementById('str-4')
            ];
            
            bars.forEach(bar => bar.className = 'strength-bar');
            
            if (password.length === 0) return;
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password) || /[^A-Za-z0-9]/.test(password)) strength++;
            
            const levels = ['weak', 'weak', 'medium', 'strong', 'strong'];
            for (let i = 0; i < strength; i++) {
                bars[i].classList.add(levels[strength]);
            }
        }

        async function login() {
            clearMessage('login');
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showMessage('login', 'Please fill in all fields');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('login', 'Please enter a valid email address');
                return;
            }

            showLoader('login');

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                gtag('config', 'G-FK3PF0KZ2R', { 'user_id': user.uid });
                gtag('event', 'login', { method: 'email' });
                localStorage.setItem('firebase_uid', user.uid);
                const idToken = await user.getIdToken();
                localStorage.setItem('firebase_id_token', idToken);
                window.location.href = 'key.html';
            } catch (error) {
                hideLoader('login');
                console.error('Login error:', error.code);
                
                const messages = {
                    'auth/user-not-found': 'No account found with this email',
                    'auth/wrong-password': 'Incorrect password',
                    'auth/invalid-email': 'Invalid email address',
                    'auth/invalid-credential': 'Invalid email or password',
                    'auth/user-disabled': 'This account has been disabled',
                    'auth/too-many-requests': 'Too many attempts. Please try again later',
                    'auth/network-request-failed': 'Network error. Please check your connection'
                };
                showMessage('login', messages[error.code] || 'Authentication failed. Please try again.');
            }
        }

        async function signup() {
            clearMessage('signup');
            
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;

            if (!name || !email || !password || !confirm) {
                showMessage('signup', 'Please fill in all fields');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('signup', 'Please enter a valid email address');
                return;
            }

            if (name.length < 2) {
                showMessage('signup', 'Display name must be at least 2 characters');
                return;
            }

            if (password.length < 6) {
                showMessage('signup', 'Password must be at least 6 characters');
                return;
            }

            if (password !== confirm) {
                showMessage('signup', 'Passwords do not match');
                return;
            }

            showLoader('signup');

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                gtag('config', 'G-FK3PF0KZ2R', { 'user_id': user.uid });
                gtag('event', 'sign_up', { method: 'email' });
                localStorage.setItem('firebase_uid', user.uid);
                await user.updateProfile({ displayName: name });
                const idToken = await user.getIdToken();
                localStorage.setItem('firebase_id_token', idToken);
                window.location.href = 'key.html';
            } catch (error) {
                hideLoader('signup');
                console.error('Signup error:', error.code);
                
                const messages = {
                    'auth/email-already-in-use': 'This email is already registered',
                    'auth/invalid-email': 'Invalid email address',
                    'auth/operation-not-allowed': 'Email/password accounts are not enabled',
                    'auth/weak-password': 'Password is too weak. Please use a stronger password',
                    'auth/network-request-failed': 'Network error. Please check your connection'
                };
                showMessage('signup', messages[error.code] || 'Registration failed. Please try again.');
            }
        }

        // Enter key handlers
        document.getElementById('login-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('login-password').focus();
        });
        
        document.getElementById('login-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        
        document.getElementById('signup-name').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('signup-email').focus();
        });
        
        document.getElementById('signup-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('signup-password').focus();
        });
        
        document.getElementById('signup-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('signup-confirm').focus();
        });
        
        document.getElementById('signup-confirm').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') signup();
        });
    </script>
</body>
</html>
