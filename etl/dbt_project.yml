name: monitr_ai_dbt
version: "1.0.0"
config-version: 2

profile: monitr_ai

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

packages-install-path: dbt_packages

models:
  monitr_ai_dbt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  monitr_ai_dbt:
    +schema: seeds
    +quote_columns: false

tests:
  +store_failures: true
